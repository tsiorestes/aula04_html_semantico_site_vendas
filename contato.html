<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVibe Store - Contato</title>
</head>
<body>

    <header>
        <h1>TechVibe Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Entre em Contato ou Faça seu Pedido</h2>
            <p>Preencha o formulário abaixo e nossa equipe responderá em até 24 horas.</p>

            <form action="#" method="post">
                <div>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>
                <br>

                <div>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>
                <br>

                <div>
                    <label for="telefone">Telefone / WhatsApp:</label><br>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                </div>
                <br>

                <div>
                    <label for="assunto">Assunto:</label><br>
                    <select id="assunto" name="assunto">
                        <option value="pedido">Fazer um Pedido</option>
                        <option value="duvida">Dúvida sobre Produto</option>
                        <option value="suporte">Suporte Técnico</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="40" required placeholder="Escreva sua mensagem ou informe o produto desejado..."></textarea>
                </div>
                <br>

                <button type="submit">Enviar Mensagem</button>
                <button type="reset">Limpar Campos</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechVibe Store. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
